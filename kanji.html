<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="かんじバトル">
<title>かんじモンスターバトル</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<!-- 初代iPad mini（iOS 9 / Safari 9）でも うごくように、ES5・タッチイベントで つくっています -->
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:rgba(0,0,0,0);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  html,body{margin:0;min-height:100%}
  body{font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN",sans-serif;background:#d9f0ff;background:linear-gradient(#bfe6ff,#e9f7ff 60%,#c8f0c0);background-attachment:fixed;color:#2b3a55;overflow-x:hidden;-webkit-text-size-adjust:100%}
  button{font-family:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;margin:0}
  .mf{font-family:"HiraMinProN-W6","Hiragino Mincho ProN","IPAMincho",serif}
  .wrap{max-width:1000px;margin:0 auto;padding:12px 14px 70px}

  /* タイトル */
  h1{font-size:32px;text-align:center;margin:8px 0 4px;color:#ff6b6b;text-shadow:2px 2px 0 #fff;line-height:1.25}
  .sub{text-align:center;margin:0 0 14px;font-size:15px;line-height:1.6}
  .modes{max-width:620px;margin:0 auto}
  .mode{display:block;width:100%;border:none;border-radius:20px;padding:14px 16px;font-size:22px;font-weight:800;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.18);text-align:left;margin-bottom:12px;overflow:hidden}
  .mode .ic{float:left;width:58px;height:58px;line-height:58px;text-align:center;font-size:42px;background:#fff;border-radius:12px;margin-right:14px;color:#2b3a55}
  .mode small{display:block;font-size:14px;font-weight:500}
  .mode:active{-webkit-transform:translateY(4px);transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
  .m1{background:#ffa94d}.m2{background:#4dabf7}.m3{background:#9775fa}
  .box{margin-top:16px;background:#fff;border-radius:18px;padding:12px;box-shadow:0 4px 0 rgba(0,0,0,.08)}
  .box h3{margin:0 0 6px;font-size:17px}
  .box h4{margin:10px 0 4px;font-size:14px;color:#5c677d}
  .box p{margin:4px 0 8px;font-size:13px;color:#5c677d}
  .ktable{overflow:hidden}
  .kc{float:left;width:40px;height:40px;line-height:40px;text-align:center;font-size:26px;margin:2px;border-radius:8px;background:#f1f3f5;color:#adb5bd;font-family:"HiraMinProN-W6","Hiragino Mincho ProN",serif}
  .kc.b1{background:#fff3bf;color:#5c677d}.kc.b2{background:#d3f9d8;color:#2b3a55}.kc.b3{background:#ffe3e3;color:#e03131}
  .legend span{display:inline-block;margin-right:10px}
  .grid{overflow:hidden}
  .slot{position:relative;float:left;width:52px;height:52px;margin:2px;background:#f1f3f5;border-radius:10px;cursor:pointer}
  .slot canvas{position:absolute;left:4px;top:4px;width:44px;height:44px}
  .slot.got{background:#e7f5ff}
  .slot.dragon.got{background:#ffe066;background:linear-gradient(135deg,#ffe066,#ff8787)}
  .slot .kira{position:absolute;right:-2px;top:-4px;font-size:14px}

  /* バトル */
  .top{overflow:hidden;font-size:16px;line-height:36px;margin-bottom:6px}
  .top #stage{float:right;font-weight:800}
  .back{float:left;border:none;background:#fff;border-radius:12px;padding:0 14px;height:36px;font-size:15px;box-shadow:0 3px 0 rgba(0,0,0,.1)}
  .battle.wide .left{float:left;width:360px}
  .battle.wide .right{margin-left:380px;text-align:center}
  .battle.tall .right{text-align:center;margin-top:8px}
  .battle.tall .qrow{overflow:hidden}
  .battle.tall .arena{float:left;width:46%}
  .battle.tall .card{margin-left:48%}
  .arena{position:relative;text-align:center;padding:8px 0 6px;border-radius:20px;-webkit-transition:background .4s;transition:background .4s}
  .arena.boss{background:#3b2a6b;background:radial-gradient(circle,#5f3dc4 0%,#2b2147 75%);color:#fff}
  .arena.strong{background:#6b1a1a;background:radial-gradient(circle,#c92a2a 0%,#3b0d0d 75%);color:#fff}
  .arena.kira{background:#fff3bf;background:linear-gradient(90deg,#ffc9c9,#ffec99,#b2f2bb,#a5d8ff,#d0bfff)}
  .monster{display:inline-block;width:168px;height:168px}
  .monster canvas{width:100%;height:100%;-webkit-animation:bob 1s steps(2) infinite;animation:bob 1s steps(2) infinite}
  @-webkit-keyframes bob{50%{-webkit-transform:translateY(-5px)}}
  @keyframes bob{50%{transform:translateY(-5px)}}
  .arena.boss .monster canvas{-webkit-filter:drop-shadow(0 0 10px #ff6b6b);filter:drop-shadow(0 0 10px #ff6b6b)}
  .monster.hit{-webkit-animation:hit .45s;animation:hit .45s}
  .monster.dead{-webkit-animation:dead .8s forwards;animation:dead .8s forwards}
  @-webkit-keyframes hit{20%{-webkit-transform:translateX(-14px) rotate(-8deg)}40%{-webkit-transform:translateX(12px) rotate(6deg)}60%{-webkit-transform:translateX(-8px)}100%{-webkit-transform:none}}
  @keyframes hit{20%{transform:translateX(-14px) rotate(-8deg)}40%{transform:translateX(12px) rotate(6deg)}60%{transform:translateX(-8px)}100%{transform:none}}
  @-webkit-keyframes dead{to{-webkit-transform:scale(0) rotate(360deg);opacity:0}}
  @keyframes dead{to{transform:scale(0) rotate(360deg);opacity:0}}
  .mname{font-size:16px;font-weight:800}
  .hpbar{width:80%;height:16px;background:#fff;border-radius:10px;margin:4px auto;overflow:hidden;border:3px solid #2b3a55}
  .hp{height:100%;background:#ff6b6b;background:linear-gradient(90deg,#ff6b6b,#ffa94d);-webkit-transition:width .4s;transition:width .4s}
  .arena.boss .hp{background:linear-gradient(90deg,#be4bdb,#ff6b6b)}
  .boom{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:60px;pointer-events:none;opacity:0}
  .boom.show{-webkit-animation:boom .6s;animation:boom .6s}
  @-webkit-keyframes boom{0%{opacity:1;-webkit-transform:scale(.3)}100%{opacity:0;-webkit-transform:scale(1.8)}}
  @keyframes boom{0%{opacity:1;transform:scale(.3)}100%{opacity:0;transform:scale(1.8)}}
  .banner{position:absolute;left:0;right:0;top:38%;font-size:26px;font-weight:800;color:#ffe066;text-shadow:3px 3px 0 #c92a2a,-2px -2px 0 #c92a2a;opacity:0;pointer-events:none}
  .banner.show{-webkit-animation:banner 1.6s;animation:banner 1.6s}
  @-webkit-keyframes banner{0%{opacity:0;-webkit-transform:scale(2)}20%{opacity:1;-webkit-transform:scale(1)}80%{opacity:1}100%{opacity:0}}
  @keyframes banner{0%{opacity:0;transform:scale(2)}20%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
  .arena.counter{-webkit-animation:counter .5s;animation:counter .5s}
  @-webkit-keyframes counter{20%{-webkit-transform:translateX(-8px);background:rgba(255,0,0,.25)}40%{-webkit-transform:translateX(8px)}60%{-webkit-transform:translateX(-5px)}100%{-webkit-transform:none}}
  @keyframes counter{20%{transform:translateX(-8px);background:rgba(255,0,0,.25)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}100%{transform:none}}
  .card{background:#fff;border-radius:22px;padding:12px 12px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.1);margin-top:10px}
  .howto{font-size:14px;color:#5c677d;font-weight:800}
  .say{font-size:28px;font-weight:800;line-height:1.6;margin-top:2px}
  .say .blank{display:inline-block;border:3px solid #ff6b6b;border-radius:10px;padding:0 8px;margin:0 3px;color:#ff6b6b;line-height:1.3}
  .chip{display:inline-block;background:#f1f3f5;border-radius:999px;padding:2px 12px;font-size:14px;font-weight:800;color:#5c677d;margin-top:4px}
  .modelK{display:inline-block;width:64px;height:64px;line-height:64px;font-size:52px;border:2px solid #a5d8ff;border-radius:8px;margin:6px 0 0 10px;vertical-align:middle}
  .hintbtn{margin-top:8px;border:none;background:#fff3bf;border-radius:12px;padding:8px 16px;font-size:16px;font-weight:800}
  .msg{text-align:center;font-size:22px;font-weight:800;min-height:56px;margin-top:10px;line-height:1.3}
  .msg small{display:block;font-size:15px;color:#5c677d}
  .msg .ok{color:#2f9e44}.msg .ng{color:#e03131}
  .crit{color:#e03131;font-size:26px;text-shadow:2px 2px 0 #ffe066;display:inline-block}
  .combo{text-align:center;font-size:15px;color:#e8590c;min-height:20px}

  .board{position:relative;background:#fff;border:5px solid #4dabf7;border-radius:10px;overflow:hidden;margin:0 auto;box-shadow:0 6px 0 rgba(0,0,0,.1)}
  .board .vline{position:absolute;left:50%;top:0;bottom:0;border-left:2px dashed #a5d8ff}
  .board .hline{position:absolute;top:50%;left:0;right:0;border-top:2px dashed #a5d8ff}
  .board .guide{position:absolute;left:0;top:0;width:100%;text-align:center;color:rgba(43,58,85,.17);-webkit-transition:opacity .25s;transition:opacity .25s;pointer-events:none}
  .board .guide.red{color:rgba(224,49,49,.42)}
  .board canvas{position:absolute;left:0;top:0;width:100%;height:100%}
  .board .stamp{left:4%;top:4%;width:92%;height:92%;pointer-events:none;opacity:.85}
  .tools{margin:10px auto 0;overflow:hidden}
  .tool{float:left;border:none;background:#fff;border-radius:14px;height:56px;padding:0 14px;font-size:18px;font-weight:800;box-shadow:0 4px 0 #a5d8ff;margin-right:8px}
  .tool.go{float:right;margin-right:0;background:#ff6b6b;color:#fff;box-shadow:0 5px 0 #c92a2a;font-size:22px;padding:0 22px}
  .tool[disabled]{opacity:.45}

  /* オーバーレイ */
  .overlay{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(43,58,85,.6);display:none;padding:20px;z-index:10;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .overlay.on{display:block}
  .panel{background:#fff;border-radius:26px;padding:22px;text-align:center;max-width:400px;margin:40px auto 0}
  .panel.boss{background:#fff9db;background:linear-gradient(#fff9db,#ffe3e3)}
  .panel canvas{width:150px;height:150px}
  .panel .pair{display:inline-block;margin:0 6px;font-size:13px;font-weight:800}
  .panel .pair canvas{display:block;width:120px;height:120px}
  .panel h2{margin:6px 0;color:#ff6b6b}
  .btn{border:none;border-radius:16px;padding:14px 20px;font-size:20px;font-weight:800;color:#fff;background:#ff6b6b;box-shadow:0 5px 0 #c92a2a;margin:6px}
  .btn.gray{background:#868e96;box-shadow:0 5px 0 #495057}
  .stars{font-size:28px;letter-spacing:4px}
  .sound{position:fixed;right:10px;bottom:10px;border:none;background:#fff;border-radius:50%;width:44px;height:44px;font-size:22px;box-shadow:0 3px 0 rgba(0,0,0,.12);z-index:5}
</style>
</head>
<body>
<div class="wrap">
  <section id="title">
    <h1>かんじ<br>モンスターバトル</h1>
    <p class="sub">かんじを かいて モンスターを たおそう!<br><small>3びき たおすと ドラゴンの ボスが でるぞ!<br>はなまるで かくと「かいしんの いちげき」!</small></p>
    <div class="modes">
      <button class="mode m1" id="m_trace"><span class="ic mf">花</span>なぞって こうげき ★<small>うすい 字を なぞって かく</small></button>
      <button class="mode m2" id="m_look"><span class="ic mf">見</span>見て かこう ★★<small>お手本を 見ながら かく</small></button>
      <button class="mode m3" id="m_test"><span class="ic">？</span>よみで かこう ★★★<small>よみがなだけを 見て かく(ヒントも あるよ)</small></button>
    </div>
    <div class="box">
      <h3>✏️ かんじ ひょう <small>(よみで かこうの はなまる <span id="kMaster"></span>)</small></h3>
      <p class="legend"><span>きいろ: なぞれた</span><span>みどり: 見て かけた</span><span style="color:#e03131">あか: よみで かけた</span></p>
      <div class="ktable" id="ktable"></div>
    </div>
    <div class="box">
      <h3>🏆 モンスターずかん <span id="bookCount"></span></h3>
      <h4>🐉 ドラゴン <span id="dGridCount"></span></h4><div class="grid" id="dGrid"></div>
      <h4>💀 つよいまもの ★★★ <span id="sGridCount"></span></h4><div class="grid" id="sGrid"></div>
      <h4>⚔️ まもの ★★ <span id="mGridCount"></span></h4><div class="grid" id="mGrid"></div>
      <h4>🦖 かいじゅう ★★ <span id="zGridCount"></span></h4><div class="grid" id="zGrid"></div>
      <h4>🐾 どうぶつ ★ <span id="aGridCount"></span></h4><div class="grid" id="aGrid"></div>
      <h4>👾 モンスター ★ <span id="nGridCount"></span></h4><div class="grid" id="nGrid"></div>
      <h4>✨ いろちがい <span id="kCount"></span></h4>
    </div>
    <p class="sub" style="font-size:13px;margin-top:14px">かくときは てのひらを がめんに つけないでね。</p>
  </section>

  <section id="battle" class="battle wide">
    <div class="top"><button class="back" id="backBtn">◀ もどる</button><div id="stage"></div></div>
    <div class="left">
      <div class="qrow">
        <div class="arena" id="arena">
          <div class="monster" id="monster"></div>
          <div class="boom" id="boom">💥</div>
          <div class="banner" id="banner"></div>
          <div class="mname" id="mname"></div>
          <div class="hpbar"><div class="hp" id="hp" style="width:100%"></div></div>
        </div>
        <div class="card">
          <div class="howto" id="howto"></div>
          <div class="say" id="say"></div>
          <span class="chip" id="meta"></span><span class="modelK mf" id="modelK"></span><br>
          <button class="hintbtn" id="btnHint">💡 ヒント(お手本を 見る)</button>
        </div>
      </div>
      <div class="msg" id="msg"></div>
      <div class="combo" id="combo"></div>
    </div>
    <div class="right">
      <div class="board" id="board">
        <div class="vline"></div><div class="hline"></div>
        <div class="guide mf" id="guide"></div>
        <canvas id="cv"></canvas>
        <canvas class="stamp" id="stamp" width="200" height="200"></canvas>
      </div>
      <div class="tools" id="tools">
        <button class="tool" id="btnUndo">↶ もどす</button><button class="tool" id="btnClear">けす</button><button class="tool go" id="btnGo">⚔️ こうげき!</button>
      </div>
    </div>
  </section>
</div>

<div class="overlay" id="win">
  <div class="panel" id="winPanel">
    <div id="winMon"></div>
    <h2 id="winTitle"></h2>
    <div class="stars" id="winStars"></div>
    <p id="winText"></p>
    <button class="btn" id="nextBtn">つぎの モンスターへ ▶</button><br>
    <button class="btn gray" id="homeBtn">おわる</button>
  </div>
</div>
<div class="overlay" id="view">
  <div class="panel">
    <div id="viewMon"></div>
    <h2 id="viewName"></h2>
    <p id="viewText"></p>
    <button class="btn gray" id="viewClose">とじる</button>
  </div>
</div>
<button class="sound" id="soundBtn">🔊</button>

            if (!usedHint)
                s.best = Math.max(s.best, mode === "test" ? g : Math.min(g, mode === "look" ? 2 : 1));
            saveK();
            combo++;
            var crit = g === 3 && !usedHint;
            if (crit) {
                $("msg").innerHTML = '<span class="crit">💥 かいしんの いちげき!</span>';
                tone([880, 1175, 1568, 2093], 0.07, "square", 0.09);
            }
            else {
                $("msg").innerHTML = '<span class="ok">' + (g === 3 ? "はなまる!" : "まる!") + ' ⚔️ あたった!</span>';
                sOk();
            }
            $("combo").textContent = combo >= 3 ? "🔥 " + combo + "れんぞく せいかい!" : "";
            hp = Math.max(0, hp - (crit ? 2 : 1));
            var el_1 = $("monster");
            el_1.className = "monster";
            void el_1.offsetWidth;
            el_1.className = "monster hit";
            var b = $("boom");
            b.textContent = crit ? (combo >= 3 ? "🌟" : "💥") : "✊";
            b.style.fontSize = crit ? "84px" : "48px";
            b.className = "boom";
            void b.offsetWidth;
            b.className = "boom show";
            updateHP();
            if (hp <= 0)
                setTimeout(function () { bgmStop(); el_1.className = "monster dead"; mon.boss ? sBossWin() : sWin(); setTimeout(showWin, 800); }, 600);
            else
                setTimeout(function () { return nextQ(pickKanji()); }, 1300);
        }
        else {
            // まちがえると モンスターの はんげき！ あかい お手本を 見て もういちど
            s.ng++;
            saveK();
            combo = 0;
            missThisMon++;
            sNg();
            $("combo").textContent = "";
            setGuide(true, true);
            var tip = r.strokeDiff >= 1 ? byK[curK][1] + "かくで かいてね" : r.cov < 0.7 ? "たりない ところが あるよ" : "あかい 字と くらべてね";
            $("msg").innerHTML = '<span class="ng">' + (g === 1 ? "おしい!" : "モンスターの はんげき!") + '</span><small>' + tip + '</small>';
            var ar = $("arena");
            ar.className = ar.className.replace(" counter", "");
            void ar.offsetWidth;
            ar.className += " counter";
            setTimeout(function () { return nextQ(curK, true); }, 2200);
        }
    }
    function showWin() {
        if (mon.pkey)
            lsDel(mon.pkey);
        saveWins(loadWins() + 1);
        var book = loadBook(), isNew = book.indexOf(mon.id) < 0;
        if (isNew) {
            book.push(mon.id);
            saveBook(book);
        }
        $("winMon").innerHTML = "";
        $("winMon").appendChild(canvasFor(mon.id, false, 3));
        $("winPanel").className = "panel" + (mon.boss ? " boss" : "");
        $("winTitle").textContent = mon.boss ? "👑 ボスを たおした!!" : mon.kira ? "✨ いろちがいを たおした!" : "やったね! たおした!";
        var st = missThisMon === 0 ? 3 : missThisMon <= 2 ? 2 : 1;
        var stx = "";
        for (var i = 0; i < 3; i++)
            stx += i < st ? "⭐" : "☆";
        $("winStars").textContent = stx;
        var nm = info(mon.id).name;
        var t = (isNew ? "「" + nm + "」を ずかんに ついかしたよ!" : "「" + nm + "」を また たおしたよ!") + (st === 3 ? " ノーミス!" : "");
        var w = loadWins() % (BOSS_EVERY + 1);
        t += w === 0 ? "" : w === BOSS_EVERY ? "  つぎは ドラゴンの ボスだ!" : "  ボスまで あと " + (BOSS_EVERY - w) + "ひき!";
        $("winText").textContent = t;
        $("win").className = "overlay on";
    }
    function goHome() {
        bgmStop();
        locked = true;
        $("win").className = "overlay";
        show($("battle"), false);
        show($("title"), true);
        renderBook();
        renderKanjiTable();
        window.scrollTo(0, 0);
    }
    function updateBtns() {
        $("btnGo").disabled = locked || !strokes.length;
        $("btnUndo").disabled = locked || !strokes.length;
        $("btnClear").disabled = locked || !strokes.length;
        $("btnHint").disabled = locked;
    }
    /* ================= ボタン ================= */
    var tap = function (id, fn) { return $(id).addEventListener("click", fn, false); };
    ["trace", "look", "test"].forEach(function (m) { return tap("m_" + m, function () { tone([880], 0.05); startMode(m); }); });
    tap("btnGo", attack);
    tap("btnUndo", function () { if (locked)
        return; strokes.pop(); redraw(); updateBtns(); });
    tap("btnClear", function () { if (locked)
        return; strokes = []; redraw(); updateBtns(); });
    tap("btnHint", function () {
        if (locked)
            return;
        usedHint = true;
        setGuide(true, false);
        $("msg").innerHTML = '<small>ヒントを 見たので かいしんの いちげきは でないよ</small>';
        setTimeout(function () { if (!locked)
            $("guide").style.opacity = 0; }, 1500);
    });
    tap("backBtn", goHome);
    tap("homeBtn", goHome);
    tap("nextBtn", function () { $("win").className = "overlay"; newMonster(); });
    tap("viewClose", function () { $("view").className = "overlay"; });
    tap("soundBtn", function () {
        soundOn = !soundOn;
        $("soundBtn").textContent = soundOn ? "🔊" : "🔇";
        if (!soundOn)
            bgmStop();
        else if (inBattle() && mon)
            bgmPlay(mon.boss ? "boss" : "battle");
    });
    window.__kanji = { judge: judge, grade: grade, setStrokes: function (s) { strokes = s; redraw(); updateBtns(); }, startMode: startMode, attack: attack, showWin: showWin, kstat: function () { return kstat; } };
    renderBook();
    renderKanjiTable();
    show($("battle"), false);
})();

</script>
</body>
</html>
